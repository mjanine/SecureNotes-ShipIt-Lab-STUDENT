# SecureNotes CI — STUDENT STARTER  (Week 17, Part B)
#
# Right now this workflow does nothing. Build it so that every push and every
# pull request to main runs the FULL test suite on a clean machine. When it's
# right, `pytest tests/test_pipeline.py` goes green here, and the Actions tab
# shows a green check after you push.
#
# You need (see the handout and the Week 17 lecture):
#   on:     triggers for push AND pull_request to main
#   jobs:   one job, runs-on ubuntu-latest, with steps that
#             1. check out the code        (actions/checkout@v4)
#             2. set up Python             (actions/setup-python@v5)
#             3. install dependencies      (pip install -r requirements.txt)
#             4. run the tests             (pytest)

name: CI

# >>> TASK 6: add the triggers (push + pull_request on main)
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
# <<< END TASK 6

# >>> TASK 7: add a `test` job that runs on ubuntu-latest with the four steps
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
# <<< END TASK 7
